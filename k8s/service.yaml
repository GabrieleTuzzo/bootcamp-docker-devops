apiVersion: v1
kind: Service
metadata:
  name: lipari-fe
spec:
  selector:
    app: lipari-fe
  ports:
    - name: http
      port: 80
      targetPort: 80
  # In produzione il frontend va esposto fuori dal cluster, tipicamente via Ingress.
  # Per l'esempio teniamo ClusterIP — l'Ingress è materiale per un corso K8s dedicato.
  type: ClusterIP
