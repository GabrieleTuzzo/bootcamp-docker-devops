apiVersion: apps/v1
kind: Deployment
metadata:
  name: lipari-fe
  labels:
    app: lipari-fe
spec:
  # Per il frontend, 2 repliche bastano per HA — Nginx è leggero e stateless.
  replicas: 2
  selector:
    matchLabels:
      app: lipari-fe
  template:
    metadata:
      labels:
        app: lipari-fe
    spec:
      containers:
        - name: nginx
          # Sostituire OWNER/REPO/SHA con i valori del workflow Docker (vedi pipeline).
          image: ghcr.io/REPLACE-OWNER/REPLACE-REPO-fe:REPLACE-SHA
          ports:
            - containerPort: 80
          # Nginx richiede pochissime risorse.
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # Liveness: se Nginx muore, K8s ricrea il Pod.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          # Readiness: Nginx è pronto subito dopo l'avvio (~3s di buffer).
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
